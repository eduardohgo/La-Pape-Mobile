# EJEMPLO INACTIVO: se conserva fuera de .github/workflows.
# No modifica ni sustituye ci.yml. No crea entornos ni concede permisos.
name: A4 preparación local sin despliegue
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a4-validacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: node docs/actividad4-ci-cd/scripts/verificar-local.mjs
      - run: node docs/actividad4-ci-cd/scripts/preparar-liberacion.mjs
      # Staging, aprobación, producción y monitoreo son diseño documental.
      # Este ejemplo no llama EAS, proveedores de hosting ni APIs externas.
